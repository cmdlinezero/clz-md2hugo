steps:
  # Test before publishing.
  - name: 'golang:1.26'
    id: 'Test'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        go test ./...

  # Build Linux binary used by Cloud Build.
  - name: 'golang:1.26'
    id: 'Build Linux AMD64'
    env:
      - 'GOOS=linux'
      - 'GOARCH=amd64'
      - 'CGO_ENABLED=0'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        mkdir -p /workspace/dist

        go build \
          -trimpath \
          -ldflags="-s -w" \
          -o /workspace/dist/${_APP_NAME}

        chmod +x /workspace/dist/${_APP_NAME}

        /workspace/dist/${_APP_NAME} --help

  # Publish binary to Generic Artifact Registry.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Publish Binary'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        gcloud artifacts generic upload \
          --project="${PROJECT_ID}" \
          --location="${_LOCATION}" \
          --repository="${_REPOSITORY}" \
          --package="${_APP_NAME}" \
          --version="${_VERSION}" \
          --source="/workspace/dist/${_APP_NAME}"

options:
  substitution_option: 'ALLOW_LOOSE'
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _LOCATION: 'us-central1'
  _REPOSITORY: 'cmdlinezero-binaries'
  _APP_NAME: 'clz-md2hugo'
  _VERSION: '0.0.4'
